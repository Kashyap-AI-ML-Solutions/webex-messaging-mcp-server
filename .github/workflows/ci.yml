name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run test coverage
        run: npm run test:coverage

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: webex-mcp-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t webex-mcp-server:test .
          echo "WEBEX_PUBLIC_WORKSPACE_API_KEY=test-token" > .env.test

          # Test 1: Tools listing functionality
          docker run --rm --env-file .env.test webex-mcp-server:test node index.js tools

          # Test 2: HTTP mode health check
          docker run -d --name webex-http-test --env-file .env.test -e TRANSPORT=http -p 3001:3001 webex-mcp-server:test
          sleep 5
          curl -f http://localhost:3001/health || (docker logs webex-http-test && exit 1)
          docker stop webex-http-test && docker rm webex-http-test

          echo "✅ All Docker tests passed"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npx --yes audit-ci@7.1.0 --config ./audit-ci.jsonc

      - name: Check for vulnerabilities
        run: npm audit --audit-level=high --dry-run
